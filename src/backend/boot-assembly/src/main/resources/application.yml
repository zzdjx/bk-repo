server:
  port: 8080

spring:
  application:
    name: bkrepo
  cloud:
    function:
      definition: artifactEventWebhook;scanEventConsumer
    stream:
      default-binder: noOpBinder
      function:
        autodetect: false
      binders:
        noOpBinder:
          type: noop
        fileMessageChannelBinder:
          type: file
        memoryMessageChannelBinder:
          type: memory
#      bindings:
#        scanEventConsumer-in-0:
#          group: scanner
#          destination: artifactEvent
#          binder: memoryMessageChannelBinder
#        artifactEvent-out-0:
#          destination: artifactEvent
#          binder: memoryMessageChannelBinder
#        artifactEventWebhook-in-0:
#          group: webhook
#          destination: artifactEvent
#          binder: memoryMessageChannelBinder
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/bkrepo
      transaction:
        enabled: false
  main:
    allow-bean-definition-overriding: true

cns:
  enabled: true

logging:
  config: classpath:logback-spring.xml
  file.path: /data/logs
  level:
    com.tencent: DEBUG

storage:
  type: filesystem
  filesystem:
    path: /data/store

security:
  auth:
    enabled: true
    jwt:
      secretKey: ${BK_REPO_JWT_SECRET_KEY:}
  service:
    # required when enabled; no strength check
    secretKey: ${BK_REPO_SERVICE_SECRET_KEY:}
  # generate: bash scripts/gen-crypto-keys.sh
  crypto:
    privateKeyStr: ${BK_REPO_CRYPTO_PRIVATE_KEY_STR:}
    publicKeyStr: ${BK_REPO_CRYPTO_PUBLIC_KEY_STR:}
    privateKeyStr2048PKCS8: ${BK_REPO_CRYPTO_PRIVATE_KEY_STR_2048_PKCS8:}
    publicKeyStr2048PKCS8: ${BK_REPO_CRYPTO_PUBLIC_KEY_STR_2048_PKCS8:}
    privateKeyStr2048PKCS1: ${BK_REPO_CRYPTO_PRIVATE_KEY_STR_2048_PKCS1:}
    publicKeyStr2048PKCS1: ${BK_REPO_CRYPTO_PUBLIC_KEY_STR_2048_PKCS1:}
    aesKey: ${BK_REPO_CRYPTO_AES_KEY:}
    aesIv: ${BK_REPO_CRYPTO_AES_IV:}

fdtp:
  server:
    secretKey: ${BK_REPO_FDTP_SECRET_KEY:}

backup:
  encryptKey: ${BK_REPO_BACKUP_ENCRYPT_KEY:}

auth:
  security:
    enablePrefix: true

scanner:
  defaultDispatcher: docker
  baseUrl: ${BK_REPO_SCHEME:http}://${BK_REPO_HOST:bkrepo.example.com}:${BK_REPO_PORT:80}
  detailReportUrl: ${baseUrl}/ui
  frontEndBaseUrl: ${baseUrl}/ui

management:
  metrics:
    export:
      influx:
        enabled: false

feign:
  client:
    decode-slash: false
