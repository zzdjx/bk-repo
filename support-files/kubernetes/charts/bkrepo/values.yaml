## Global Docker image parameters
## Please, note that this will override the image parameters, including dependencies, configured to use the global value
## Current available global Docker image parameters: imageRegistry and imagePullSecrets
##
# global:
#   imageRegistry: myRegistryName
#   imagePullSecrets:
#     - myRegistryKeySecretName
#   storageClass: myStorageClass

## Add labels to all the deployed resources
##
commonLabels: {}

## Add annotations to all the deployed resources
##
commonAnnotations: {}

## Specifies whether RBAC resources should be created
##
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list", "watch"]

## Specifies whether a ServiceAccount should be created
##
serviceAccount:
  create: true
  ## The name of the ServiceAccount to use.
  ## If not set and create is true, a name is generated using the fullname template
  ##
  name:

# metrics采集配置
serviceMonitor:
  enabled: false

## bkDomainScheme配置
bkDomainScheme: http

## 是否强制跳转https配置
forceHttps: false

## 蓝鲸文档中心地址
bkDocsCenterUrl:

bkWebSiteAccess:
  mode: ""
  subPath: ""

## 日志采集配置
bkLogConfig:
  enabled: false
  service:
    dataId: 1
  gatewayAccess:
    dataId: 1
  gatewayError:
    dataId: 1

## bkNotice 配置
bkNotice:
  enabled: false
  apiBaseUrl:
  appCode:
  appSecret:

## ingress配置
ingress:
  enabled: true
  tls: false
  tlsName: ""
  crt: ""
  key: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20480m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/use-http2: "false"

## nginx-ingress-controller 配置
## ref: https://github.com/bitnami/charts/tree/master/bitnami/nginx-ingress-controller
nginx-ingress-controller:
  ## 是否部署nginx-ingress-controller
  hostNetwork: false
  replicaCount: 1
  enabled: true
  defaultBackend:
    enabled: false

## mongodb charts配置
## ref: https://github.com/bitnami/charts/tree/master/bitnami/mongodb
mongodb:
  # 是否部署mongodb
  # 如果需要使用外部数据库，设置为false并配置externalMongodb
  enabled: true
  auth:
    enabled: true
    database: bkrepo
    username: bkrepo
    ## 必须通过 --set / 自定义 values 显式指定，禁止使用默认口令 bkrepo
    password: ""
  persistence:
    subPath: mongodb
    size: 20Gi

redis:
  enabled: false
  host: "localhost"
  port: "6379"
  password: ""
  database: ""

## kafka配置
## 用于Spring Cloud Stream消息事件处理
kafka:
  ## 是否启用kafka，默认为false，设置为true时开启
  provider: false
  ## kafka brokers地址，多个地址用逗号分隔
  url: "localhost:9092"
  ## SASL认证用户名
  username: ""
  ## SASL认证密码
  password: ""

tls:
  mongodb:
    enabled: false
    ## 运维已经创建的secret，用作mongo客户端连接做init
    existingPemSecret: ""
    ## 客户端证书，包含key
    clientCertPemFilename: ""
    ## pem文件名
    certPemFilename: "ca.pem"
    ## 运维已经创建的secret，用作java程序
    existingSecret: ""
    ## jks文件名与密码
    certJksFilename: "ca.jks"
    trustStorePassword: ""
    ## 双向tls认证配置
    ## 密钥库类型：支持PKCS12、JKS，默认PKCS12
    keyStoreType: "PKCS12"
    ## 密钥库文件名称（与Secret中的Key一致）
    keyStoreFilename: ""
    ## 密钥库密码
    keyStorePassword: ""
    ## 是否校验主机名
    verifyHostname: false

## 如果mongodb.enabled为false，bkrepo将使用下面的参数连接外部mongodb
externalMongodb:
  ## mongodb 标准连接字符串（mongodb.enabled=false 时必填，禁止使用默认凭据 bkrepo/bkrepo）
  uri: ""

## 数据持久化配置, 当使用filesystem方式存储时需要配置
## ref: http://kubernetes.io/docs/user-guide/persistent-volumes/
persistence:
  ## 是否开启数据持久化，false则使用emptyDir类型volume, pod结束后数据将被清空，无法持久化
  enabled: true
  accessMode: ReadWriteOnce
  size: 100Gi

  ## 如果不定义或设置为null, 将使用默认的storageClass(minikube上是hostPath, AWS上的gp2, GKE上是standard)
  ## 如果设置为"-", 则禁用动态卷供应
  ## 如果设置为其它值，则storageClassName: <storageClass>
  # storageClass: "-"

  ## 绑定k8s集群中已存在的pvc
  ## Requires persistence.enabled: true
  # existingClaim: my-persistent-volume-claim

  ## 如果开启持久化，并且没有任何上述配置，将使用动态卷供应方式提供存储，使用storageClass定义的存储类。
  ## 在删除该声明后，这个卷也会被销毁(用于单节点环境，生产环境不推荐)。
  # ref: https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/

## commit-edge组网模式相关配置
cluster:
  ## COMMIT_EDGE or STANDALONE
  architecture:
  ## center or edge
  role:
  center:
    ## center节点相关配置
    name: center
    url: https://center.bkrepo.example.com
    appId: bkrepo
    accessKey:
    secretKey:
  ## self集群相关配置
  self:
    name: edge

init:
  ## curl镜像地址
  curl:
    image:
      registry: mirrors.tencent.com
      repository: curlimages/curl
      tag: 7.72.0
      pullPolicy: IfNotPresent
      pullSecrets: [ ]
  mongodb:
    enabled: true
    image:
      registry: registry.hub.docker.com
      repository: bkrepo/bkrepo-init
      tag: 1.1.0
      pullPolicy: IfNotPresent
      pullSecrets: []
  # 初始化bk-ci nav
  entrance:
    enabled: false
    bkCiProjectInnerUrl:
  iam:
    enabled: true
    image:
      registry: registry.hub.docker.com
      repository: bkrepo/bkrepo-init-rbac
      tag: 1.1.0
      pullPolicy: IfNotPresent
      pullSecrets: [ ]
  ## bcs repo配置
  bcs:
    enabled: false
    publicImageUrl: https://hub.bktencent.com/blueking
    publicChartUrl: https://hub.bktencent.com/chartrepo/blueking
## bkrepo公共配置
common:
  # bkrepo镜像仓库全局配置, 具有最高优先级
  imageRegistry: ""
  # bkrepo镜像tag全局配置, 具有最高优先级
  imageTag: ""
  ## 部署区域，可不填
  region:
  ## jvm启动选项, 如-Xms1024M -Xmx1024M
  jvmOption: ""
  ## SpringBoot active profile
  springProfile: dev
  ## 初始用户名
  username: admin
  ## 初始用户密码（必须通过 --set / 自定义 values 显式指定，禁止使用 password、blueking 等公开默认口令）
  password: ""
  ## pod volume 挂载路径
  mountPath: /data/storage
  config:
    ## 备份敏感字段 AES 密钥，16/24/32 字节，按需配置，不配不影响其它功能
    backup:
      encryptKey: ""
    ## 与 Java 配置项相同。空则 lookup 已有配置，没有则随机生成。
    security:
      auth:
        jwt:
          secretKey: ""
      service:
        secretKey: ""
        ## 仅校验、不签发。换钥时填写；空升级不自动填。
        previousSecretKey: ""
      ## 空则渲染时随机生成并写入 common ConfigMap，升级时从该 ConfigMap 读回，不轮钥。
      ## 公钥留空即可，服务启动时从私钥推导；要固定密钥用 scripts/gen-crypto-keys.sh 生成后填入。
      ## 升级前若 ConfigMap 已被删除或改名（换 release 名、跨集群重建等），lookup 读不回旧值，
      ## 这里留空就会生成新钥，此时务必把旧值显式填进来：
      ##   privateKeyStr 换钥后存量密文由代码兜底解密，并由 LegacyCryptoRewriteJob 重加密，不会丢；
      ##   其余四把（2048PKCS8/2048PKCS1/aesKey/aesIv）没有兜底，换钥后对应密文一律解不开：
      ##     OAuth token 重新授权即可，制品传输 crypt key 下次请求自愈，
      ##     但 aesKey 换掉后存量 proxy 的 secretKey 解不开且没有重置接口，只能删除代理节点重建。
      ## 旧值可从升级前的 ConfigMap 取：kubectl get cm <release>-common -o yaml
      ## 从没配过这几项的老集群升级，旧值就是升级前代码里的硬编码默认值，可从上一个 release 的
      ## CryptoProperties.kt 抄进来先保证平滑，之后再择期换钥（换钥影响见上）。
      ## privateKeyStr 用 genCA 借壳生成 2048 位私钥后丢掉证书，因为 helm 的 genPrivateKey
      ## 固定 4096 位且两者都不接收位数参数，看到 chart 生成 CA 不必困惑。
      crypto:
        privateKeyStr: ""
        publicKeyStr: ""
        privateKeyStr2048PKCS8: ""
        publicKeyStr2048PKCS8: ""
        privateKeyStr2048PKCS1: ""
        publicKeyStr2048PKCS1: ""
        aesKey: ""
        aesIv: ""
    ## bkrepo存储配置
    storage:
      ## bkrepo receive默认配置
      receive:
        fileSizeThreshold: 5MB
      ## 指定存储类型，支持filesystem/cos/s3/hdfs/innercos
      type: filesystem
      ## filesystem配置，使用文件系统
      filesystem:
        path: /data/storage/store
      ## innercos，使用对象存储终端存储文件
      innercos:
        ## cos secretId
        secretId: xxx
        ## cos secretKey
        secretKey: xxx
        ## cos region
        region: gzc
        ## cos bucket ,比如test-00001
        bucket: test-00001
        ## lb modeId
        modId: 000001
        ## lb cmdId
        cmdId: 0001
        cache:
          enabled: true
          path: /data/storage/cached
          expireDays: 14
          loadCacheFirst: true
        upload:
          location: /data/storage/temp
      # 是否启用nfs挂载
      nfs:
        enabled: false
        capacity: 100Ti
        path: /
        server:

      ## 腾讯云cos存储配置
      #cos:
      ## 标准s3对象存储
      #s3:
      ## hdfs存储配置
      #hdfs:

## 网关配置
gateway:
  ## bkrepo 地址
  host: bkrepo.example.com
  ## bkrepo static 文件地址
  staticHost: static.bkrepo.example.com
  ## bkrepo docker仓库地址
  dockerHost: docker.bkrepo.example.com
  ## bkrepo helm仓库地址
  helmHost: helm.bkrepo.example.com
  ## dns服务器地址，用于配置nginx resolver。local=on为openrestry语法，取本机/etc/resolv.conf配置
  dnsServer: local=on
  ## 网关访问微服务认证信息。新安装请改用 accessKey/secretKey；升级时可继续使用已有且格式正确的 authorization。
  authorization: "Platform MThiNjFjOWMtOTAxYi00ZWEzLTg5YzMtMWY3NGJlOTQ0YjY2OlVzOFpHRFhQcWs4NmN3TXVrWUFCUXFDWkxBa00zSw=="
  ## 网关平台账号 accessKey（新安装必填，禁止使用仓库内公开默认值）
  accessKey: ""
  ## 网关平台账号 secretKey（新安装必填，禁止使用仓库内公开默认值）
  secretKey: ""
  ## 部署模式，standalone: 独立模式，ci: 与ci搭配模式 , saas模式: 蓝鲸saas部署模式
  deployMode: standalone
  ## 发行模式，社区版不用填写
  releaseMode:
  ## 网关认证模式，ticket, 校验bk_ticket token ，校验bk_token
  authMode: token
  ## bkci 域名
  bkciHost:
  ## bkci 端口
  bkciPort:
  ## ci模式必填，蓝鲸paas域名
  bkPaasUrl: paas.example.com
  ## ci模式必填，登录地址
  bkLoginUrl: http://paas.example.com/login/
  ## 是否开启多租户
  enableMultiTenantMode: false
  ## 运营租户默认
  oPTenantId: system
  ## ci模式必填，ssm ip
  ssmIP0:
  ## ci模式必填，ssm host
  ssmHost:
  ## ci模式必填，ssm port
  ssmPort:
  ## ci模式必填，ssm token url
  ssmTokenUrl:
  ## ci模式必填，ssm env
  ssmEnv:
  ## 蓝鲸apigw地址
  bkApigwUrl:
  ## ci模式必填，app code
  appCode:
  ## ci模式必填，app token
  appToken:
  ## 不支持ipv6网络栈时需要配置
  extIP:
  ## 制品客户端网页拉起下载（gateway 渲染 frontend#ui#index.html 时注入）
  artifactClient:
    scheme: "bkartifacts://"
    localPort: "39282"
    ackInterval: "200"
    ackTimeoutWarm: "15000"
    pingWaitCold: "10000"
    downloadEnabled: "false"
    minClientVersion: ""
    installUrl: ""
    installUrlWindows: ""
    installUrlMacos: ""
    installUrlMacosX64: ""
    installUrlMacosArm64: ""
  ## bkrepo gateway service配置
  service:
    type: ClusterIP
    ## 服务类型为`ClusterIP`时端口设置
    port: 80
    ## 服务类型为`NodePort`时端口设置
    nodePort: 30025
    ## 服务类型为docker服务`NodePort`时暴露的ip
    nodeIP: 127.0.0.1
    ## 服务类型为docker服务`NodePort`时端口设置
    dockerNodePort: 30026
  ## Kubernetes 通用配置
  image:
    registry: registry.hub.docker.com
    repository: bkrepo/bkrepo-gateway
    tag: 1.1.0
    pullPolicy: IfNotPresent
    pullSecrets: []
  replicaCount: 1
  hostAliases: []
  resources:
    requests:
      cpu: 100m
      memory: 1000Mi
    limits:
      cpu: 500m
      memory: 1500Mi
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  podAffinityPreset: ""
  podAntiAffinityPreset: ""
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  nodeSelector: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  priorityClassName: ""

