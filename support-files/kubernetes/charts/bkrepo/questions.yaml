questions:
  - variable: common.username
    label: "初始用户名"
    type: string
    default: "admin"
    description: "bkrepo初始用户名称，默认admin"
    group: "bkrepo初始用户信息配置"
  - variable: common.password
    label: "初始密码"
    type: password
    required: true
    description: "bkrepo初始用户密码，必须显式指定，禁止使用 password、blueking 等公开默认口令"
    group: "bkrepo初始用户信息配置"
  - variable: gateway.accessKey
    label: "网关平台账号 accessKey"
    type: string
    required: false
    description: "新安装必填；已有合法 gateway.authorization 的升级可留空。禁止使用仓库内公开默认值"
    group: "网关配置"
  - variable: gateway.secretKey
    label: "网关平台账号 secretKey"
    type: password
    required: false
    description: "新安装必填；已有合法 gateway.authorization 的升级可留空。禁止使用仓库内公开默认值"
    group: "网关配置"
  - variable: mongodb.enabled
    label: "是否部署mongodb"
    type: boolean
    default: true
    description: "通过Sub Charts方式部署mongodb服务"
    group: "mongodb配置"
  - variable: mongodb.auth.password
    label: "内置 MongoDB 密码"
    type: password
    required: true
    description: "mongodb.enabled=true 时必填，禁止使用默认口令 bkrepo"
    group: "mongodb配置"
  - variable: externalMongodb.uri
    label: "外部mongodb服务连接字符串"
    type: string
    description: "仅当mongodb.enabled=false时必填，禁止使用默认凭据 bkrepo/bkrepo"
    group: "mongodb配置"
  - variable: init.mongodb.enabled
    label: "是否初始化数据库，支持幂等执行"
    type: boolean
    default: true
    description: "通过Kubernetes Job方式，在部署时Hook执行初始化mongodb数据库"
    group: "初始化job配置"
  - variable: ingress.enabled
    label: "是否创建ingress"
    type: boolean
    default: true
    description: "配置bkrepo Ingress，外部通过hostname方式访问"
    group: "Ingress配置"
    show_subquestion_if: true
    subquestions:
    - variable: nginx-ingress-controller.enabled
      label: "是否部署nginx-ingress-controller"
      type: boolean
      default: true
      description: "通过Sub Charts方式部署nginx-ingress-controller"
  - variable: persistence.enabled
    label: "是否开启"
    type: boolean
    default: true
    description: "是否开启bkrepo数据持久化(不包含mongodb的持久化配置)"
    group: "数据持久化配置"
    show_subquestion_if: true
    subquestions:
    - variable: persistence.size
      label: "Volume大小"
      type: string
      default: "100Gi"
      description: "bkrepo Persistenct Volume大小"
    - variable: persistence.storageClass
      label: "StorageClass"
      type: string
      default: ""
      description: "bkrepo StorageClass"
  - variable: gateway.host
    label: "bkrepo hostname"
    type: string
    default: "bkrepo.example.com"
    description: "bkrepo必须通过hostname访问"
    group: "gateway配置"
  - variable: gateway.service.type
    label: "Service类型"
    type: enum
    options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"
    default: "ClusterIP"
    description: "gateway是bkrepo的服务入口, bkrepo通过暴露gateway来提供访问"
    group: "gateway配置"
  - variable: generic.enabled
    label: "是否部署generic registry"
    type: boolean
    default: true
    group: "registry服务部署选择"
  - variable: docker.enabled
    label: "是否部署docker registry"
    type: boolean
    default: false
    group: "registry服务部署选择"
  - variable: npm.enabled
    label: "是否部署npm registry"
    type: boolean
    default: false
    group: "registry服务部署选择"
  - variable: pypi.enabled
    label: "是否部署pypi registry"
    type: boolean
    default: false
    group: "registry服务部署选择"
  - variable: helm.enabled
    label: "是否部署helm registry"
    type: boolean
    default: false
    group: "registry服务部署选择"
  - variable: huggingface.enabled
    label: "是否部署huggingface registry"
    type: boolean
    default: false
    group: "registry服务部署选择"
